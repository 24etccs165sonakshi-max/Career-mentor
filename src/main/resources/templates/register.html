<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Your Account - AimHigh</title>

    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <header>
      <div class="logo-container">
        <svg
          viewBox="0 0 100 100"
          width="44"
          height="44"
          class="site-logo"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="50" cy="45" r="38" stroke="#0090D0" stroke-width="6" />

          <circle cx="63" cy="34" r="8" fill="#00E5FF" />

          <path d="M53 52C53 45 57 43 63 43C69 43 73 45 73 52" fill="#00E5FF" />

          <circle cx="50" cy="38" r="8" fill="#00BFFF" />

          <path d="M40 56C40 49 44 47 50 47C56 47 60 49 60 56" fill="#00BFFF" />

          <circle cx="37" cy="42" r="8" fill="#0077B6" />

          <path d="M27 60C27 53 31 51 37 51C43 51 47 53 47 60" fill="#0077B6" />

          <path
            d="M30 64L48 50L58 57L75 35"
            stroke="#FF8500"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

          <polygon points="77,32 68,34 74,42" fill="#FF8500" />
        </svg>

        <h1>AimHigh</h1>
      </div>

      <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/admin/login">Admin Login</a>
      </nav>
    </header>

    <div class="auth-wrapper">
      <div class="auth-card">
        <h2>Create Your Account</h2>

        <p>Join and start your career journey</p>

        <div th:if="${error}" class="error">
          <span th:text="${error}"></span>
        </div>

        <form
          th:action="@{/register}"
          th:object="${student}"
          method="post"
          onsubmit="return Validation();"
        >
          <!-- NAME -->

          <div class="form-group">
            <label>Full Name</label>

            <input
              type="text"
              id="fullname"
              th:field="*{name}"
              placeholder="Enter your full name"
              oninput="validateName()"
            />

            <span id="fname" class="error"></span>
          </div>

          <!-- EMAIL -->

          <div class="form-group">
            <label>Email Address</label>

            <input
              type="text"
              id="email"
              th:field="*{email}"
              placeholder="Enter your email"
              oninput="validateEmail()"
            />

            <span id="emailerror" class="error"></span>
          </div>

          <!-- PASSWORD -->

          <div class="form-group">
            <label>Password</label>

            <input
              type="password"
              id="password"
              th:field="*{password}"
              placeholder="Create a password"
              oninput="validatePassword()"
            />

            <span id="passworderror" class="error"></span>
          </div>

          <button type="submit" class="btn-primary btn-block">Register</button>
        </form>

        <div class="auth-footer">
          Already have an account?

          <a href="/login">Login</a>
        </div>
      </div>
    </div>

    <script>
      // =========================
      // NAME VALIDATION
      // =========================

      function validateName() {
        let fullname = document.getElementById("fullname").value;

        let error = document.getElementById("fname");

        // Number entered
        if (/[0-9]/.test(fullname)) {
          error.innerHTML = "Numbers are not allowed";

          return false;
        }

        // Special character entered
        if (/[^A-Za-z ]/.test(fullname)) {
          error.innerHTML = "Special characters are not allowed";

          return false;
        }

        // Empty
        if (fullname.trim() === "") {
          error.innerHTML = "Enter Full Name";

          return false;
        }

        // Minimum length
        if (fullname.trim().length < 3) {
          error.innerHTML = "Name must contain at least 3 characters";

          return false;
        }

        error.innerHTML = "";

        return true;
      }

      // =========================
      // EMAIL VALIDATION
      // =========================

      function validateEmail() {
        let email = document.getElementById("email").value.trim();

        let error = document.getElementById("emailerror");

        // Space
        if (/\s/.test(email)) {
          error.innerHTML = "Spaces are not allowed in email";

          return false;
        }

        // Invalid characters
        if (/[^A-Za-z0-9@._%+-]/.test(email)) {
          error.innerHTML = "Invalid character in email";

          return false;
        }

        // @ entered incorrectly
        if ((email.match(/@/g) || []).length > 1) {
          error.innerHTML = "Email can contain only one @";

          return false;
        }

        // Basic email format
        let pattern = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

        if (email !== "" && !pattern.test(email)) {
          error.innerHTML = "Enter a valid email";

          return false;
        }

        if (email === "") {
          error.innerHTML = "Enter Email";

          return false;
        }

        error.innerHTML = "";

        return true;
      }

      // =========================
      // PASSWORD VALIDATION
      // =========================

      function validatePassword() {
        let password = document.getElementById("password").value;

        let error = document.getElementById("passworderror");

        // Empty
        if (password === "") {
          error.innerHTML = "Password is required";

          return false;
        }

        // Number not present
        if (!/[0-9]/.test(password)) {
          error.innerHTML = "Password must contain a number";

          return false;
        }

        // Uppercase not present
        if (!/[A-Z]/.test(password)) {
          error.innerHTML = "Password must contain an uppercase letter";

          return false;
        }

        // Lowercase not present
        if (!/[a-z]/.test(password)) {
          error.innerHTML = "Password must contain a lowercase letter";

          return false;
        }

        // Special character not present
        if (!/[@$!%*?&]/.test(password)) {
          error.innerHTML = "Password must contain a special character";

          return false;
        }

        if (password.length < 8) {
          error.innerHTML = "Password must contain at least 8 characters";

          return false;
        }

        error.innerHTML = "";

        return true;
      }

      // =========================
      // FORM VALIDATION
      // =========================

      function Validation() {
        if (!validateName()) return false;

        if (!validateEmail()) return false;

        if (!validatePassword()) return false;

        return true;
      }
    </script>
  </body>
</html>
