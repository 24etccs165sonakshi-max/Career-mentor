<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - AimHigh</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body>
    <header>
      <div class="logo-container">
        <svg
          viewBox="0 0 100 100"
          width="44"
          height="44"
          class="site-logo"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="50" cy="45" r="38" stroke="#0090D0" stroke-width="6" />
          <circle cx="63" cy="34" r="8" fill="#00E5FF" />
          <path d="M53 52C53 45 57 43 63 43C69 43 73 45 73 52" fill="#00E5FF" />
          <circle cx="50" cy="38" r="8" fill="#00BFFF" />
          <path d="M40 56C40 49 44 47 50 47C56 47 60 49 60 56" fill="#00BFFF" />
          <circle cx="37" cy="42" r="8" fill="#0077B6" />
          <path d="M27 60C27 53 31 51 37 51C43 51 47 53 47 60" fill="#0077B6" />
          <path
            d="M30 64L48 50L58 57L75 35"
            stroke="#FF8500"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <polygon points="77,32 68,34 74,42" fill="#FF8500" />
        </svg>
        <h1>AimHigh</h1>
      </div>

      <nav>
        <a href="/">Home</a>
        <a href="/login">Student Login</a>
        <a href="/register">Register</a>
      </nav>
    </header>

    <div class="auth-wrapper">
      <div class="auth-card">
        <h2>Admin Login</h2>

        <p>Login to manage mentors</p>

        <form action="/admin/login" method="post">
          <div class="form-group">
            <label>Admin Name</label>

            <input
              type="text"
              name="name"
              placeholder="Enter admin name"
              required
            />
          </div>

          <div class="form-group">
            <label>Password</label>

            <input
              type="password"
              name="password"
              placeholder="Enter password"
              required
            />
          </div>

          <button type="submit" class="btn-primary btn-block">Login</button>
        </form>

        <div class="auth-footer">
          <a href="/">← Back to Home</a>
        </div>
      </div>
    </div>
  </body>
</html>
