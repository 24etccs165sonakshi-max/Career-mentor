<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select Interests - AimHigh</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .interests-box {
        max-width: 600px;
        margin: 3rem auto;
        background: #fff;
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
        border: 1px solid #e2e8f0;
      }
      .tag-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin: 1.5rem 0 2rem 0;
        text-align: left;
      }
      .tag-label {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo-container">
        <svg
          viewBox="0 0 100 100"
          width="44"
          height="44"
          class="site-logo"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <circle cx="50" cy="45" r="38" stroke="#0090D0" stroke-width="6" />
          <circle cx="63" cy="34" r="8" fill="#00E5FF" />
          <path d="M53 52C53 45 57 43 63 43C69 43 73 45 73 52" fill="#00E5FF" />
          <circle cx="50" cy="38" r="8" fill="#00BFFF" />
          <path d="M40 56C40 49 44 47 50 47C56 47 60 49 60 56" fill="#00BFFF" />
          <circle cx="37" cy="42" r="8" fill="#0077B6" />
          <path d="M27 60C27 53 31 51 37 51C43 51 47 53 47 60" fill="#0077B6" />
          <path
            d="M30 64L48 50L58 57L75 35"
            stroke="#FF8500"
            stroke-width="5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <polygon points="77,32 68,34 74,42" fill="#FF8500" />
        </svg>
        <h1>AimHigh</h1>
      </div>

      <nav>
        <a href="/logout">Logout</a>
      </nav>
    </header>

    <main>
      <div class="interests-box">
        <h2>Select Your Interests</h2>
        <p>
          Choose domains you are interested in so we can find your ideal mentor.
        </p>

        <form th:action="@{/interests}" method="post">
          <div class="tag-grid">
            <label class="tag-label">
              <input type="checkbox" name="interests" value="Data Science" />
              Data Science
            </label>
            <label class="tag-label">
              <input type="checkbox" name="interests" value="Web Development" />
              Web Development
            </label>
            <label class="tag-label">
              <input
                type="checkbox"
                name="interests"
                value="Artificial Intelligence"
              />
              Artificial Intelligence
            </label>
            <label class="tag-label">
              <input
                type="checkbox"
                name="interests"
                value="Machine Learning"
              />
              Machine Learning
            </label>
            <label class="tag-label">
              <input type="checkbox" name="interests" value="Cyber Security" />
              Cyber Security
            </label>
            <label class="tag-label">
              <input type="checkbox" name="interests" value="Cloud Computing" />
              Cloud Computing
            </label>
          </div>

          <button type="submit" class="btn-primary btn-block">
            Save & Find Mentors
          </button>
        </form>
      </div>
    </main>
  </body>
</html>
